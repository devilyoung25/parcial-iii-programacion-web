<h2 mat-dialog-title>{{ proyecto ? 'Editar proyecto' : 'Crear proyecto' }}</h2>
<mat-dialog-content>
  <form id="form-proyecto" [formGroup]="form" (ngSubmit)="guardar()" class="mt-3">
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="120" required>
      @if (form.controls.nombre.invalid) { <mat-error>Escribe un nombre de hasta 120 caracteres.</mat-error> }
    </mat-form-field>
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" rows="4"></textarea>
    </mat-form-field>
    @if (error) { <p class="alert alert-danger" role="alert">{{ error }}</p> }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" [disabled]="saving">Cancelar</button>
  <button mat-flat-button class="bg-cyan" form="form-proyecto" type="submit" [disabled]="saving">
    {{ saving ? 'Guardando…' : 'Guardar' }}
  </button>
</mat-dialog-actions>
