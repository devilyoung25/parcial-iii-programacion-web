<h2 mat-dialog-title>Actualización de usuarios</h2>
<mat-dialog-content>
  <form id="editar-usuario" [formGroup]="formUpdateUsers" (ngSubmit)="updateUsers()" class="row mt-3">
    <div class="col-md-6">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" maxlength="100" required>
        @if (formUpdateUsers.controls.nombre.invalid) { <mat-error>Escribe un nombre de hasta 100 caracteres.</mat-error> }
      </mat-form-field>
    </div>
    <div class="col-md-6">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput formControlName="email" type="email" required>
        @if (formUpdateUsers.controls.email.invalid) { <mat-error>Escribe un correo válido.</mat-error> }
      </mat-form-field>
    </div>
    @if (error) { <p class="alert alert-danger" role="alert">{{ error }}</p> }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [disabled]="saving" mat-dialog-close>Cancelar</button>
  <button mat-flat-button form="editar-usuario" type="submit" [disabled]="saving || formUpdateUsers.invalid">
    {{ saving ? 'Guardando…' : 'Actualizar' }}
  </button>
</mat-dialog-actions>
